[project]
name = "sqlalchemy-example"
version = "0.1.0"
description = "SQLAlchemy ORM example: shop with customers, products, tags and orders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"
